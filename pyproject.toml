[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "g5live-recon-helper"
version = "0.2.0"
description = "A learning-focused, evidence-led TCP reconnaissance helper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "requests>=2.32,<3",
]

[project.scripts]
recon-helper = "recon.cli:main"

[tool.setuptools.packages.find]
include = ["recon*"]
